      - {arm: soup5, blank_penalty: 1.0}
      - {arm: soup5, blank_penalty: 2.0}
      - {arm: s44}
      - {arm: soup5}
      - {arm: p1raw}
      - {arm: sunbird51}
      - {arm: p1av}
      - {arm: turbo_linsna_r}
