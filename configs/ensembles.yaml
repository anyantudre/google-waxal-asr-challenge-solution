# Ensemble recipes.
#
# Each recipe is named after the submission file that was sent to Zindi, so a recipe maps to exactly
# one leaderboard row and the mapping stays true if later work produces a better one. Scores below
# are public-leaderboard results for that exact file.
#
#     python -m waxal_asr.modeling.predict --list
#     python -m waxal_asr.modeling.predict --recipe p2n_ens_distil
#
# A recipe lists the arms that vote and the decoding used for each. The FIRST entry is the anchor:
# its text survives every slot unless the members outvote it, so order is significant and anchor
# choice moves the result more than any single member does.
#
# An entry is `arm` plus an optional `blank_penalty`. A penalty of 0 means ordinary greedy decoding;
# a positive value subtracts that amount from the CTC blank logit before the arg max, which restores
# characters the decoder would otherwise drop. See waxal_asr/decode.py for why, and docs/SOLUTION.md
# for the measurement.
#
# `attention_mask: false` appears on every blank-penalty member and needs explaining, because it
# reproduces a defect rather than a decision. Those members were produced by a script that passed
# only the input features to the encoder, omitting the mask that says which frames are padding.
# Self-attention therefore treated the zero-padding of shorter clips in a batch as real audio. That
# is wrong, and it changes about half of all transcripts. It is kept because p2n_ens_distil exists to
# rebuild an earlier result exactly, and that result was produced this way. Its greedy members came
# from a path that did pass the mask, which is why they carry no such flag.
#
# If you are building a new ensemble rather than reproducing this one, leave the flag off and let it
# default to true.

# Which checkpoint each short arm name refers to, and where it is published. The short names are the
# internal run names used by the training configs and the per-arm transcript cache; the repositories
# are what a reader needs in order to fetch the weights. tests/test_submission_pipeline.py checks
# this block against the registry in waxal_asr/config.py so the two cannot drift apart.
arms:
  s43:
    repo: anyantudre/waxal-w2vbert-linsna-seed43
    note: fresh seed 43 from w2v-bert-2.0, anchors every ensemble here
  s44:
    repo: anyantudre/waxal-w2vbert-linsna-seed44
    note: fresh seed 44, adds FLEURS, Shunya and ASR Africa
  soup5:
    repo: anyantudre/waxal-w2vbert-linsna-soup5
    note: uniform weight average of five checkpoints from the p1raw lineage
  p1raw:
    repo: anyantudre/waxal-w2vbert-linsnalug-raw
    note: root of the family, the raw capitals and punctuation vocabulary
  linspec_r:
    repo: anyantudre/waxal-w2vbert-lin-specialist
    note: Lingala specialist, AfriVoice then a WAXAL refresh
  snaspec_r:
    repo: anyantudre/waxal-w2vbert-sna-specialist
    note: Shona specialist, AfriVoice then a WAXAL refresh
  p1av:
    repo: anyantudre/waxal-w2vbert-linsna-afrivoicemix
    note: the mixed-curriculum counter-experiment, republished as a retrain
  distil:
    repo: anyantudre/waxal-w2vbert-linsna-distilled
    note: ensemble distillation, the strongest single checkpoint
  turbo_linsna_r:
    repo: anyantudre/waxal-whisper-turbo-linsna
    note: Whisper large-v3-turbo, architectural diversity, generated greedily at 200 tokens;
      unlike the Sunbird arm it does not window, so clips past 30 seconds are truncated
  s46:
    repo: anyantudre/waxal-w2vbert-linsna-seed46
    note: fresh seed 46 on the seed-43 corpus, the most decorrelated arm here, holdout 0.2588
  soup6:
    repo: anyantudre/waxal-w2vbert-linsna-soup6
    note: the five soup members plus the distilled arm, averaged uniformly
  sunbird51:
    repo: Sunbird/asr-whisper-51-african-languages
    note: third party, zero-shot, pinned to revision 5d4f0038, beam 8, language routed

defaults:
  # Combined member weight needed to overrule the anchor. Both differ from the ensemble script's own
  # defaults and must be passed explicitly to reproduce a submission.
  vote_threshold: 2.0
  skeleton: anchor

recipes:

  # Final submission, pick 1. The best result obtained in this competition.
  p2n_ens_distil:
    description: 26 members, the blank-penalty core plus the distilled arm
    public_score: 0.764915
    cer: 0.108961
    wer: 0.361209
    members:
      - {arm: s43}                                  # anchor
      - {arm: s43, blank_penalty: 1.5, attention_mask: false}
      - {arm: s43, blank_penalty: 1.0, attention_mask: false}
      - {arm: s43, blank_penalty: 2.0, attention_mask: false}
      - {arm: p1raw, blank_penalty: 1.5, attention_mask: false}
      - {arm: p1raw, blank_penalty: 1.0, attention_mask: false}
      - {arm: p1raw, blank_penalty: 2.0, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 1.5, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 1.0, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 2.0, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 1.5, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 1.0, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 2.0, attention_mask: false}
      - {arm: s44, blank_penalty: 1.5, attention_mask: false}
      - {arm: s44, blank_penalty: 1.0, attention_mask: false}
      - {arm: s44, blank_penalty: 2.0, attention_mask: false}
      - {arm: soup5, blank_penalty: 1.5, attention_mask: false}
      - {arm: soup5, blank_penalty: 1.0, attention_mask: false}
      - {arm: soup5, blank_penalty: 2.0, attention_mask: false}
      - {arm: s44}
      - {arm: soup5}
      - {arm: p1raw}
      - {arm: sunbird51}
      - {arm: p1av}
      - {arm: turbo_linsna_r}
      - {arm: distil}

  # Final submission, pick 2. The same core without the distilled arm, and the configuration that
  # was tested most heavily. It differs from pick 1 by 0.000156, which is inside the noise floor.
  p2n_ens_bp25:
    description: 25 members, the blank-penalty core
    public_score: 0.764759
    cer: 0.109025
    wer: 0.361457
    members:
      - {arm: s43}                                  # anchor
      - {arm: s43, blank_penalty: 1.5, attention_mask: false}
      - {arm: s43, blank_penalty: 1.0, attention_mask: false}
      - {arm: s43, blank_penalty: 2.0, attention_mask: false}
      - {arm: p1raw, blank_penalty: 1.5, attention_mask: false}
      - {arm: p1raw, blank_penalty: 1.0, attention_mask: false}
      - {arm: p1raw, blank_penalty: 2.0, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 1.5, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 1.0, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 2.0, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 1.5, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 1.0, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 2.0, attention_mask: false}
      - {arm: s44, blank_penalty: 1.5, attention_mask: false}
      - {arm: s44, blank_penalty: 1.0, attention_mask: false}
      - {arm: s44, blank_penalty: 2.0, attention_mask: false}
      - {arm: soup5, blank_penalty: 1.5, attention_mask: false}
      - {arm: soup5, blank_penalty: 1.0, attention_mask: false}
      - {arm: soup5, blank_penalty: 2.0, attention_mask: false}
      - {arm: s44}
      - {arm: soup5}
      - {arm: p1raw}
      - {arm: sunbird51}
      - {arm: p1av}
      - {arm: turbo_linsna_r}

  # The first configuration to draw blank-penalty members from several checkpoints, which is where
  # most of the ensemble gain came from.
  p2n_ens_bp10:
    description: 17 members, the configuration that established source diversity
    public_score: 0.764476
    cer: 0.108578
    wer: 0.362471
    members:
      - {arm: s43}                                  # anchor
      - {arm: s43, blank_penalty: 1.5, attention_mask: false}
      - {arm: p1raw, blank_penalty: 1.5, attention_mask: false}
      - {arm: linspec_r, blank_penalty: 1.5, attention_mask: false}
      - {arm: snaspec_r, blank_penalty: 1.5, attention_mask: false}
      - {arm: s44, blank_penalty: 1.5, attention_mask: false}
      - {arm: soup5, blank_penalty: 1.5, attention_mask: false}
      - {arm: s44, blank_penalty: 1.0, attention_mask: false}
      - {arm: soup5, blank_penalty: 1.0, attention_mask: false}
      - {arm: s44, blank_penalty: 2.0, attention_mask: false}
      - {arm: soup5, blank_penalty: 2.0, attention_mask: false}
      - {arm: s44}
      - {arm: soup5}
      - {arm: p1raw}
      - {arm: sunbird51}
      - {arm: p1av}
      - {arm: turbo_linsna_r}

  # The same 26 members as p2n_ens_distil, but with the correct forward pass: the attention mask is
  # passed for every member, so self-attention never treats zero-padding as audio. This is what the
  # code does by default, and it is NOT what produced the historical submission.
  #
  # It is here because the correction turned out to be worth score rather than costing it. This
  # recipe scores 0.766563 against 0.764915 for the historical unmasked configuration, a gain of
  # 0.001648, and it improves CER and WER together. An intermediate version, identical except that
  # its Whisper member was broken and contributed nothing, scored 0.766253, so the working Whisper
  # member is worth a further 0.000310.
  #
  # Read the size honestly: 0.001648 is about 1.3 standard errors on the public split. What makes it
  # more than that is the way it was obtained. Neither change was selected by searching the
  # leaderboard; both are corrections to defects found by running the pipeline end to end and
  # diffing it against the submitted members, and both moved CER and WER in the same direction.
  #
  # Prefer this recipe for new work. Use p2n_ens_distil only to reproduce the submitted file.
  p2n_ens_masked:
    description: 26 members, the corrected forward pass
    public_score: 0.766563
    cer: 0.108364
    wer: 0.358509
    members:
      - {arm: s43}                                  # anchor
      - {arm: s43, blank_penalty: 1.5}
      - {arm: s43, blank_penalty: 1.0}
      - {arm: s43, blank_penalty: 2.0}
      - {arm: p1raw, blank_penalty: 1.5}
      - {arm: p1raw, blank_penalty: 1.0}
      - {arm: p1raw, blank_penalty: 2.0}
      - {arm: linspec_r, blank_penalty: 1.5}
      - {arm: linspec_r, blank_penalty: 1.0}
      - {arm: linspec_r, blank_penalty: 2.0}
      - {arm: snaspec_r, blank_penalty: 1.5}
      - {arm: snaspec_r, blank_penalty: 1.0}
      - {arm: snaspec_r, blank_penalty: 2.0}
      - {arm: s44, blank_penalty: 1.5}
      - {arm: s44, blank_penalty: 1.0}
      - {arm: s44, blank_penalty: 2.0}
      - {arm: soup5, blank_penalty: 1.5}
      - {arm: soup5, blank_penalty: 1.0}
      - {arm: soup5, blank_penalty: 2.0}
      - {arm: s44}
      - {arm: soup5}
      - {arm: p1raw}
      - {arm: sunbird51}
      - {arm: p1av}
      - {arm: turbo_linsna_r}
      - {arm: distil}

  # The five ensembles that the meta recipe below votes over. Each is a complete 26 or 38 member
  # vote in its own right, and each uses the correct forward pass throughout. They differ in which
  # checkpoints fill the slots and in how much weight the two weakest members carry, so their errors
  # are not identical, which is what makes averaging them worth anything.

  p2n_ens_weighted:
    description: 26 members, the two weakest at half weight
    public_score: 0.766580
    members:
      - {arm: s43}   # anchor
      - {arm: s43, blank_penalty: 1.5}
      - {arm: s43, blank_penalty: 1.0}
      - {arm: s43, blank_penalty: 2.0}
      - {arm: p1raw, blank_penalty: 1.5}
      - {arm: p1raw, blank_penalty: 1.0}
      - {arm: p1raw, blank_penalty: 2.0}
      - {arm: linspec_r, blank_penalty: 1.5}
      - {arm: linspec_r, blank_penalty: 1.0}
      - {arm: linspec_r, blank_penalty: 2.0}
      - {arm: snaspec_r, blank_penalty: 1.5}
      - {arm: snaspec_r, blank_penalty: 1.0}
      - {arm: snaspec_r, blank_penalty: 2.0}
      - {arm: s44, blank_penalty: 1.5}
      - {arm: s44, blank_penalty: 1.0}
      - {arm: s44, blank_penalty: 2.0}
      - {arm: soup5, blank_penalty: 1.5}
      - {arm: soup5, blank_penalty: 1.0}
      - {arm: soup5, blank_penalty: 2.0}
      - {arm: s44}
      - {arm: soup5}
      - {arm: p1raw}
      - {arm: sunbird51, weight: 0.5}
      - {arm: p1av, weight: 0.5}
      - {arm: turbo_linsna_r}
      - {arm: distil}

  p2n_ens_soup6:
    description: 26 members, the six-way soup in place of the five-way
    public_score: 0.766226
    members:
      - {arm: s43}   # anchor
      - {arm: s43, blank_penalty: 1.5}
      - {arm: s43, blank_penalty: 1.0}
      - {arm: s43, blank_penalty: 2.0}
      - {arm: p1raw, blank_penalty: 1.5}
      - {arm: p1raw, blank_penalty: 1.0}
      - {arm: p1raw, blank_penalty: 2.0}
      - {arm: linspec_r, blank_penalty: 1.5}
      - {arm: linspec_r, blank_penalty: 1.0}
      - {arm: linspec_r, blank_penalty: 2.0}
      - {arm: snaspec_r, blank_penalty: 1.5}
      - {arm: snaspec_r, blank_penalty: 1.0}
      - {arm: snaspec_r, blank_penalty: 2.0}
      - {arm: s44, blank_penalty: 1.5}
      - {arm: s44, blank_penalty: 1.0}
      - {arm: s44, blank_penalty: 2.0}
      - {arm: soup6, blank_penalty: 1.5}
      - {arm: soup6, blank_penalty: 1.0}
      - {arm: soup6, blank_penalty: 2.0}
      - {arm: s44}
      - {arm: soup6}
      - {arm: p1raw}
      - {arm: sunbird51, weight: 0.5}
      - {arm: p1av, weight: 0.5}
      - {arm: turbo_linsna_r}
      - {arm: distil}

  p2n_ens_s46swap:
    description: 26 members, seed 46 in place of the weakest arm
    public_score: 0.766477
    members:
      - {arm: s43}   # anchor
      - {arm: s43, blank_penalty: 1.5}
      - {arm: s43, blank_penalty: 1.0}
      - {arm: s43, blank_penalty: 2.0}
      - {arm: p1raw, blank_penalty: 1.5}
      - {arm: p1raw, blank_penalty: 1.0}
      - {arm: p1raw, blank_penalty: 2.0}
      - {arm: linspec_r, blank_penalty: 1.5}
      - {arm: linspec_r, blank_penalty: 1.0}
      - {arm: linspec_r, blank_penalty: 2.0}
      - {arm: snaspec_r, blank_penalty: 1.5}
      - {arm: snaspec_r, blank_penalty: 1.0}
      - {arm: snaspec_r, blank_penalty: 2.0}
      - {arm: s44, blank_penalty: 1.5}
      - {arm: s44, blank_penalty: 1.0}
      - {arm: s44, blank_penalty: 2.0}
      - {arm: soup5, blank_penalty: 1.5}
      - {arm: soup5, blank_penalty: 1.0}
      - {arm: soup5, blank_penalty: 2.0}
      - {arm: s44}
      - {arm: soup5}
