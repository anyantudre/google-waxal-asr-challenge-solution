      - {arm: s43, blank_penalty: 0.5}
      - {arm: s43, blank_penalty: 2.5}
      - {arm: p1raw, blank_penalty: 0.5}
      - {arm: p1raw, blank_penalty: 2.5}
      - {arm: linspec_r, blank_penalty: 0.5}
      - {arm: linspec_r, blank_penalty: 2.5}
      - {arm: snaspec_r, blank_penalty: 0.5}
      - {arm: snaspec_r, blank_penalty: 2.5}
      - {arm: s44, blank_penalty: 0.5}
      - {arm: s44, blank_penalty: 2.5}
      - {arm: soup5, blank_penalty: 0.5}
      - {arm: soup5, blank_penalty: 2.5}

  # The best result. This votes over the five finished ensembles above rather than over models.
  # Member-level averaging reduces bias; a second level over complete ensembles reduces variance,
  # which is what a larger held-out split rewards. The inputs are included regardless of their own
  # scores, two of them being worse than the best single ensemble: this averages, it does not select.
  p2n_meta:
    description: a vote over five complete ensembles
    public_score: 0.766683
    cer: 0.108386
    wer: 0.358249
    ensembles:
      - p2n_ens_weighted
      - p2n_ens_masked
      - p2n_ens_soup6
      - p2n_ens_s46swap
      - p2n_ens_wide


  # A single arm, for verifying the pipeline end to end without downloading every checkpoint. The
  # strongest single model, and still well below any of the ensembles above.
  p2n_distil_nl_f:
    description: the distilled arm on its own
    public_score: 0.746787
    cer: 0.113117
    wer: 0.393308
    members:
      - {arm: distil}
