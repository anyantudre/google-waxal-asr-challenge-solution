# Independent-seed CTC arm (seed 43).  name: w2vbert_s43
#
# Fresh initialisation of w2v-bert-2.0 on WAXAL lin/sna train plus the WAXAL Phase-1 test split
# (permitted in Phase 2). Fresh seeds proved the most valuable ensemble members measured
# (~+0.0032 each): cheaper and more effective than adding new architectures.
#
# Base: facebook/w2v-bert-2.0 (600M) + CTC head, add_adapter. Multi-condition training
# (MUSAN noise + RIR reverb) is applied ON-THE-FLY in the collator so each epoch sees fresh
# augmentation. Targets and vocabulary are RAW (see the normalize block at the end).
#
# Published as anyantudre/waxal-w2vbert-linsna-seed43.

data:
  languages: [lin, sna]
  map_in_memory: false  # 29k rows; mmap is shared by workers and bounds the cache                     # DISK: only ~23G free vs a ~21G raw-waveform Map -> keep it in the
                                          # 90G node RAM instead (41k rows x ~0.5MB ~= 21G). Requires serial map.
  map_num_proc: null                      # must stay serial: num_proc>1 spills temp shards to disk

  external:
    - {local: data/waxal_test/manifest_test.tsv, audio_col: audio, text_col: transcription, sep: "	"}

model:
  type: w2v_bert
  id: facebook/w2v-bert-2.0
  add_adapter: true
  freeze_base: false
  gradient_checkpointing: true
  # NO vocab_dir: fresh RAW vocab (caps+punct as CTC tokens) built from these transcripts

train:
  seed: 43                                # fresh init -> decorrelated errors vs the p1raw lineage
  per_device_batch_size: 12               # matches the champion (600M + add_adapter on 32GB)
  grad_accum: 3                           # effective batch 36
  lr: 1.0e-4
  warmup_ratio: 0.1
  num_epochs: 8
  fp16: false
  bf16: true
  save_total_limit: 2                     # DISK: 250G ZFS quota is a hard limit (w2v-BERT ckpts ~7G each)
  dataloader_num_workers: 4               # parallelize the on-the-fly collator mel-FE + aug

augment:
  enabled: true
  noise_dir: data/noise/musan/noise    # MUSAN noise (SLR17), NOT speech/
  rir_dir: data/noise/RIRS_NOISES/simulated_rirs   # OpenSLR 28 RIRs
  noise_min_snr: 5.0
  noise_max_snr: 20.0
  p_noise: 0.5
  p_rir: 0.3
  p_gaussian: 0.1
  p_gain: 0.3
  p_pitch: 0.0                            # DROPPED, formant-warping, char-CTC-toxic (-2.8% confirmed)
  p_speed: 0.0                            # DROPPED, same
  p_air: 0.0
  p_mp3: 0.0

infer:
  language_from_id: false

# RAW targets and RAW vocabulary: no lowercasing and no punctuation stripping. CER is scored on the
# raw string and WER does not strip punctuation, so a stripped model is capped on both metrics.
normalize:
  lowercase: false
  strip_punct: false
  nfc: true
  collapse_ws: true

# SEED-43 INDEPENDENT ARM. Corpus is WAXAL lin/sna train + the public P1-test gold (29k rows), 
# deliberately NOT AfriVoice: at 63k rows the cached-waveform map hit 86G and killed the turbo run,
# and the curriculum evidence says in-style gold is what carries the score anyway. Expected ~0.74
# solo, which is inside the measured ensemble tolerance (members must sit within ~0.015 of the anchor).
